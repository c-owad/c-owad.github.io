<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Binding Pocket Analyzer</title>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <script src="https://3Dmol.csb.pitt.edu/build/3Dmol-min.js"></script>
    
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; background-color: #121212; color: #ffffff; }
        
        /* The WebGL Canvas Container */
        #viewer-container { flex: 2; position: relative; }
        #gldiv { width: 100%; height: 100%; position: absolute; }
        
        /* The Analytics Sidebar */
        #sidebar { flex: 1; padding: 30px; background-color: #1e1e1e; border-left: 2px solid #333; overflow-y: auto; box-shadow: -5px 0 15px rgba(0,0,0,0.5); z-index: 10; }
        h1 { font-size: 1.5rem; margin-top: 0; color: #4db8ff; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .data-card { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .data-label { font-size: 0.85rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .data-value { font-size: 1.2rem; font-weight: bold; margin-top: 5px; color: #fff; }
        .residue-tag { display: inline-block; background: #4db8ff; color: #000; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; margin: 3px; font-weight: bold; }
        
        #controls { position: absolute; top: 20px; left: 20px; z-index: 100; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; }
        input, button { padding: 8px; margin-right: 5px; border: none; border-radius: 4px; }
        button { background-color: #4db8ff; color: #000; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #3aa3e3; }
    </style>
</head>
<body>

    <div id="viewer-container">
        <div id="controls">
            <input type="text" id="pdb-input" value="6CM4" placeholder="Enter PDB ID (e.g., 6CM4)">
            <button onclick="loadProtein()">Load Receptor</button>
        </div>
        <div id="gldiv"></div>
    </div>

    <div id="sidebar">
        <h1>Interaction Analytics</h1>
        <p style="color: #aaa; font-size: 0.9rem;">Click on any small molecule (ligand) in the 3D viewer to analyze its binding pocket and chemical properties.</p>
        
        <div id="analytics-content" style="display: none;">
            <div class="data-card">
                <div class="data-label">Selected Ligand</div>
                <div class="data-value" id="ui-ligand-name">Loading...</div>
            </div>
            <div class="data-card">
                <div class="data-label">Chemical Formula</div>
                <div class="data-value" id="ui-formula">-</div>
            </div>
            <div class="data-card">
                <div class="data-label">Molecular Weight</div>
                <div class="data-value" id="ui-weight">-</div>
            </div>
            <div class="data-card">
                <div class="data-label">Interacting Amino Acids (< 6.0 Å)</div>
                <div id="ui-pocket" style="margin-top: 10px;"></div>
            </div>
        </div>
    </div>

    <script>
        let viewer = null;
        let currentPdbId = "6CM4"; // Default Serotonin receptor

        // Initialize the 3Dmol viewer
        $(document).ready(function() {
            let element = $('#gldiv');
            let config = { backgroundColor: '#121212' };
            viewer = $3Dmol.createViewer(element, config);
            loadProtein();
        });

        function loadProtein() {
            currentPdbId = document.getElementById('pdb-input').value.toUpperCase();
            viewer.clear();
            
            // 3Dmol natively fetches the PDB for visual rendering
            $3Dmol.download("pdb:" + currentPdbId, viewer, {}, function() {
                // Style the main protein backbone as a sleek ribbon
                viewer.setStyle({polymer: true}, {cartoon: {color: 'spectrum'}});
                
                // Style the ligands (drugs/small molecules) as clickable spheres/sticks
                viewer.setStyle({hetflag: true}, {stick: {radius: 0.3}, sphere: {radius: 0.8}});
                
                // Add click event listener to the ligands
                viewer.setClickable({hetflag: true}, true, handleLigandClick);
                
                viewer.zoomTo();
                viewer.render();
            });
            
            // Hide analytics until a click happens
            document.getElementById('analytics-content').style.display = 'none';
        }

        // Triggered when the user clicks a ligand in the WebGL canvas
        async function handleLigandClick(atom, glViewer) {
            // Re-render the whole protein to reset any previous highlights
            viewer.setStyle({polymer: true}, {cartoon: {color: 'spectrum'}});
            viewer.setStyle({hetflag: true}, {stick: {radius: 0.3}, sphere: {radius: 0.8}});

            // Construct the unique key to match our Flask backend logic
            const ligandKey = `${atom.resn}_${atom.chain}_${atom.resi}`;
            
            // Show loading state in UI
            document.getElementById('analytics-content').style.display = 'block';
            document.getElementById('ui-ligand-name').innerText = `Analyzing ${atom.resn}...`;
            document.getElementById('ui-formula').innerText = '...';
            document.getElementById('ui-weight').innerText = '...';
            document.getElementById('ui-pocket').innerHTML = '';

            try {
                // Fetch analytics from our custom Flask backend
                const response = await fetch(`https://one5113hw4backend.onrender.com/api/analyze/${currentPdbId}/${ligandKey}`);
                if (!response.ok) throw new Error("Backend analysis failed");
                
                const data = await response.json();

                // Update UI with RCSB Chemical Data
                document.getElementById('ui-ligand-name').innerText = data.properties.name || data.ligand_id;
                document.getElementById('ui-formula').innerText = data.properties.formula || 'Unknown';
                document.getElementById('ui-weight').innerText = data.properties.weight ? `${data.properties.weight} g/mol` : 'Unknown';

                // Update UI with Computed Binding Pocket
                const pocketDiv = document.getElementById('ui-pocket');
                data.binding_pocket.forEach(residue => {
                    let span = document.createElement('span');
                    span.className = 'residue-tag';
                    span.innerText = residue;
                    pocketDiv.appendChild(span);
                });

                // --- 3D INTERACTIVITY: Highlight the pocket ---
                // Parse out the sequence numbers from the backend string (e.g., "TRP120(A)" -> 120)
                const interactingResis = data.binding_pocket.map(r => parseInt(r.match(/\d+/)[0]));
                
                // Dim the rest of the protein
                viewer.setStyle({polymer: true}, {cartoon: {color: 'white', opacity: 0.3}});
                
                // Highlight the specific interacting amino acids with bright sticks
                viewer.setStyle({resi: interactingResis}, {stick: {colorscheme: 'amino', radius: 0.2}});
                
                // Highlight the clicked ligand
                viewer.setStyle({resn: atom.resn, chain: atom.chain, resi: atom.resi}, {sphere: {color: 'cyan'}});
                
                // Zoom camera into the binding pocket
                viewer.zoomTo({resi: interactingResis});
                viewer.render();

            } catch (error) {
                console.error(error);
                document.getElementById('ui-ligand-name').innerText = "Error analyzing ligand.";
            }
        }
    </script>
</body>
</html>
